<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MONEY/FREE HUB — Scripts</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="scripts.css">
  <link rel="stylesheet" href="style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f5f5f5;
      color: #111;
      line-height: 1.5;
    }

    a { text-decoration: none; color: inherit; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* NAVBAR */
    .navbar {
      background: #111;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      gap: 40px;
      height: 64px;
    }

    .logo {
      font-family: 'Libre Baskerville', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
    }

    .logo span { color: #f5c500; }

    .nav-links { display: flex; gap: 28px; }

    .nav-links a {
      color: #ccc;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: #f5c500;
      border-bottom: 2px solid #f5c500;
      padding-bottom: 2px;
    }

    /* PAGE HEADER */
    .page-header {
      background: #f5f5f5;
      padding: 56px 0 36px;
    }

    .eyebrow {
      font-size: 0.78rem;
      font-weight: 700;
      color: #f5c500;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .page-header h1 {
      font-family: 'Libre Baskerville', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      color: #111;
      margin: 8px 0 0;
    }

    .yellow { color: #f5c500; }

    /* BOXES SECTION */
    .boxes-section {
      padding: 40px 0 80px;
      background: #f5f5f5;
    }

    .boxes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    /* BOX CARD */
    .box-card {
      border-radius: 14px;
      overflow: hidden;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .box-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.22);
    }

    .box-inner {
      padding: 30px 26px 26px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 10px;
    }

    .box-title {
      font-family: 'Libre Baskerville', serif;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .box-desc {
      font-size: 0.85rem;
      opacity: 0.8;
      line-height: 1.6;
      flex: 1;
    }

    .box-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      border: 2px solid;
      border-radius: 6px;
      padding: 8px 16px;
      width: fit-content;
      transition: opacity 0.2s, transform 0.15s;
    }

    .box-link:hover {
      opacity: 0.75;
      transform: translateX(2px);
    }

    /* FOOTER */
    .footer {
      background: #111;
      padding: 28px 0;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-inner p { color: #666; font-size: 0.82rem; }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .boxes-grid { grid-template-columns: repeat(2, 1fr); }
      .nav-links { display: none; }
    }

    @media (max-width: 560px) {
      .boxes-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <div class="logo">MONEY/<span>FREE</span> HUB</div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="boxes.html" class="active">Scripts</a>
        <a href="https://discord.gg/dXMn3wsEP8">Discord</a>
      </nav>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <p class="eyebrow">Our Scripts</p>
      <h1>Our <span class="yellow">Scripts!</span></h1>
    </div>
  </section>

  <section class="boxes-section">
    <div class="container">
      <div class="boxes-grid">
        <div class="box-card" style="background:#1a1a2e; color:#ffffff;">
          <div class="box-inner">
            <h3 class="box-title">ETERNAL ENEMIES $5</h3>
            <p class="box-desc">Live time accese to our script.</p>
            <a href="#" class="box-link" style="color:#ffffff; border-color:#ffffff;">Buy</a>
          </div>
        </div>

        <div class="box-card" style="background:#0f3d0f; color:#ffffff;">
          <div class="box-inner">
            <h3 class="box-title">Age  of Titans 13$</h3>
            <p class="box-desc">Live time accese to our script.</p>
            <a href="#" class="box-link" style="color:#ffffff; border-color:#ffffff;">Buy</a>
          </div>
        </div>

        <div class="box-card" style="background:#677ba0; color:#ffffff;">
          <div class="box-inner">
            <h3 class="box-title">Jujutsu Shenanigens</h3>
            <p class="box-desc">Join Our Discord to get This Script (Free)</p>
            <a href="https://discord.gg/dXMn3wsEP8" class="box-link" style="color:#ffffff; border-color:#ffffff;">Join</a>
          </div>
        </div>

      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="logo">MONEY/<span>FREE</span> HUB</div>
      <p></p>
    </div>
  </footer>

</body>
</html>
